<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="utf-8">
<title>Namaska vremena</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a0c16">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="stage" id="stage">

  <header class="top">
    <div class="logo"><img id="logo" src="assets/logo.png" alt=""></div>
    <div class="clock" id="clock">--:--:--</div>
    <div class="mosque">
      <div class="mosque-name" id="mosqueName"></div>
      <div class="mosque-year" id="yearLine"></div>
    </div>
  </header>

  <div class="datebar" id="dateBar"></div>

  <main class="times" id="times"></main>

  <div class="next" id="next"></div>

  <section class="hadith" id="hadith">
    <div class="h-frame">
      <div class="h-title"><i></i><span>Hadis</span><i></i></div>
      <div class="h-slide" id="hSlide">
        <div class="h-img" id="hImg"><img id="hImgTag" alt=""></div>
        <div class="h-body" id="hBody">
          <div class="h-ar" id="hAr" lang="ar" dir="rtl"></div>
          <div class="h-text" id="hText"></div>
          <div class="h-src" id="hSrc"></div>
        </div>
      </div>
      <div class="h-dots" id="hDots"></div>
    </div>
  </section>

  <div class="notice" id="notice" hidden></div>
</div>
<script src="js/app.js"></script>
</body>
</html>
